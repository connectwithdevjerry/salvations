name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # The architecture, expressed as tests. Runs first and fastest: if a boundary
  # broke, nothing else matters.
  invariants:
    name: Architectural invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Grep gates (AC-11, AC-12, AC-13)
        run: pnpm invariants
      - name: Package boundaries
        run: pnpm boundaries

  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Integration tests need a REPLICA SET: change streams (SSE event bus) and
  # transactions both require one. A standalone mongod silently breaks both.
  integration:
    name: Integration (MongoDB replica set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Start MongoDB replica set
        run: pnpm db:up
      - name: Integration tests
        run: pnpm test
        env:
          MONGODB_URI: mongodb://localhost:27017/salvations_test?replicaSet=rs0&directConnection=true
          MONGODB_DB_NAME: salvations_test

  # AC-16: the container must BUILD AND BOOT AGAINST A REAL DATABASE.
  #
  # An image that boots with no configuration and answers a static page proves
  # only that Node started. This supplies real environment variables and probes
  # /api/health/ready, which parses the configuration and pings the database
  # from INSIDE the container — the two things that actually break a deployment.
  containers:
    name: Container build and boot
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.3
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t salvations-web:ci .

      - name: Boot web image against the test database
        run: |
          # Generated per run: a secret committed to a workflow file is a
          # secret, and these only have to satisfy the schema and be distinct.
          docker run -d --name web --network host \
            -e PORT=3000 \
            -e MONGODB_URI='mongodb://127.0.0.1:27017/salvations_ci?directConnection=true' \
            -e MONGODB_DB_NAME=salvations_ci \
            -e AUTH_JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')" \
            -e CREDENTIAL_KEK="$(openssl rand -base64 32 | tr -d '\n')" \
            -e INTERNAL_HMAC_SECRET="$(openssl rand -base64 48 | tr -d '\n')" \
            -e PUBLIC_BASE_URL='http://localhost:3000' \
            salvations-web:ci

          for i in $(seq 1 45); do
            body=$(curl -fsS http://localhost:3000/api/health/ready 2>/dev/null || true)
            if [ -n "$body" ] && printf '%s' "$body" | grep -q '"ready":true'; then
              echo "container is ready: $body"
              exit 0
            fi
            sleep 2
          done

          echo "container never became ready. Last response:"
          curl -sS http://localhost:3000/api/health/ready || true
          echo
          docker logs web
          exit 1

      - name: Container serves a page, not just an API
        run: curl -fsS http://localhost:3000/signin | grep -q 'Sign in'

      - name: Webhook endpoint refuses an unsigned delivery
        run: |
          # The one endpoint with no session and no API key in front of it. Its
          # only defence is each adapter's own signature check, so "does it say
          # no to an unsigned body" is worth asserting against the real image
          # rather than a unit test with a hand-built Headers object.
          #
          # An unknown connection is a 404 and an unsigned one a 401 — never a
          # 200, which would mean the body reached the code that starts runs.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{"message":{"text":"hi"}}' \
            http://localhost:3000/api/channels/telegram/chn_does_not_exist)
          echo "unsigned delivery → $status"
          if [ "$status" = "200" ]; then
            echo "the webhook accepted an unsigned delivery"
            exit 1
          fi

      - name: Container logs contain no secret material
        run: |
          # The redaction middleware is only worth having if it holds in the
          # image people actually deploy.
          if docker logs web 2>&1 | grep -aiE 'CREDENTIAL_KEK|AUTH_JWT_SECRET|INTERNAL_HMAC_SECRET'; then
            echo "a secret name appeared in container logs alongside its value"
            exit 1
          fi

      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t salvations-worker:ci .

      - name: Smoke the worker image
        run: docker run --rm salvations-worker:ci pnpm --filter @salvations/worker start --smoke
